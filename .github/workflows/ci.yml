name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run --group dev ruff check .
      - run: uv run --group dev python -m pytest -q
      - name: Replay the year from the frozen prices and cached Lyzr verdicts (no network)
        run: LYZR_OFFLINE=1 uv run python scripts/replay_offline.py
