[project]
name = "muhurat-desk"
version = "0.1.0"
description = "Muhurat Desk: governed multi-agent paper-trading desk (Analyst, Lyzr Compliance, Trader) on Band, for the Diwali Festiverse A2A Hackathon."
requires-python = ">=3.11,<3.14"
dependencies = [
    "band-sdk[langgraph]>1.6.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.3.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "xxhash==3.5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]
